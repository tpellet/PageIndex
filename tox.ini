[tox]
envlist = fix,type,test
isolated_build = true
requires =
    tox-uv

[testenv:fix]
description = Fix code style with ruff
skip_install = true
deps =
    ruff
commands =
    ruff check --fix pageindex tests
    ruff format pageindex tests

[testenv:type]
description = Type check with mypy
deps =
    mypy
commands =
    mypy pageindex

[testenv:test]
description = Run tests with pytest
deps =
    pytest
    pytest-asyncio
    pytest-cov
commands =
    pytest tests --cov=pageindex --cov-report=term-missing {posargs:-q}

[testenv:lint]
description = Check code style without fixing
skip_install = true
deps =
    ruff
commands =
    ruff check pageindex tests
    ruff format --check pageindex tests
