[project]
name = "pageindex"
version = "0.2.0"
description = "Vectorless reasoning-based RAG with hierarchical tree indices - fork with txt file support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VectifyAI", email = "dev@vectify.ai"},
]
maintainers = [
    {name = "tpellet"},
]
keywords = ["rag", "llm", "retrieval", "document-indexing", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "pymupdf>=1.20",
    "PyPDF2>=3.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.5",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/tpellet/PageIndex"
"Original Project" = "https://github.com/VectifyAI/PageIndex"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pageindex"]

[tool.hatch.build.targets.sdist]
exclude = [".env", ".env.*", ".venv", "*.pyc", "__pycache__"]

[tool.ruff]
src = ["pageindex", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.mypy]
python_version = "3.12"
packages = ["pageindex"]
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
